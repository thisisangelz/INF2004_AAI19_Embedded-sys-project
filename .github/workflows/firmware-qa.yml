name: Firmware QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.3.0

jobs:
  software-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out firmware
        uses: actions/checkout@v4

      - name: Install pinned-platform QA tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build gcc g++ gcc-arm-none-eabi libnewlib-arm-none-eabi cppcheck clang-tidy python3-pip git
          python3 -m pip install --break-system-packages gcovr==8.3

      - name: Fetch Pico SDK
        run: |
          git clone --branch "${PICO_SDK_VERSION}" --depth 1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      - name: Record tool versions
        run: |
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version
          cppcheck --version
          clang-tidy --version
          gcovr --version

      - name: Run shared QA gate
        shell: pwsh
        run: ./scripts/qa/run.ps1 full

      - name: Publish QA summary
        if: always()
        run: |
          if [ -f artifacts/qa/report.md ]; then cat artifacts/qa/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-qa-report
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 14

