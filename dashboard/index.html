<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Log Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <h1>Run log dashboard</h1>
    <p>Beacon robot · saved runs from <code>docs/runs</code></p>
  </div>
  <nav class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-run" aria-selected="true">Run</button>
    <button role="tab" id="tab-compare" aria-selected="false">Compare runs</button>
  </nav>
  <label class="open" for="file">Open log file…</label>
  <input id="file" type="file" accept=".txt,text/plain" multiple hidden>
</header>
<div class="layout">
  <aside id="side" aria-label="Runs"></aside>
  <main id="main"></main>
</div>
<div id="drop" hidden>Drop robot log files to add them</div>
<div id="toast" role="status" hidden></div>
<script src="logparser.js"></script>
<script src="runs.js"></script>
<script src="app.js"></script>
</body>
</html>
